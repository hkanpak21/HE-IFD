<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" font-family="serif" font-size="11">

  <defs>
    <!-- Upload arrow head (ColorBrewer Dark2 teal) -->
    <marker id="arrow-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B9E77"/>
    </marker>
    <!-- Download arrow head (ColorBrewer Dark2 orange) -->
    <marker id="arrow-dn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D95F02"/>
    </marker>
    <!-- Neutral arrow head for threshold-gate inset and annotation pointer -->
    <marker id="arrow-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- ================ Title ================ -->
  <g id="title">
    <text x="400" y="22" text-anchor="middle" font-size="14" font-weight="bold">Threat model: semi-honest server + up to N-1 colluding clients</text>
  </g>

  <!-- ================ Clients column (left) ================ -->
  <g id="clients">
    <text x="100" y="50" text-anchor="middle" font-style="italic" fill="#555">N clients (depicted N=4)</text>

    <!-- Colluding client 1 -->
    <rect x="30" y="65" width="140" height="60" fill="#C6A87D" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="100" y="84" text-anchor="middle" font-weight="bold">C_1 (may collude)</text>
    <text x="100" y="100" text-anchor="middle">D_1, T_1, sk_1</text>
    <text x="100" y="116" text-anchor="middle" font-style="italic" fill="#555">may collude with server</text>

    <!-- Colluding client 2 -->
    <rect x="30" y="140" width="140" height="60" fill="#C6A87D" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="100" y="159" text-anchor="middle" font-weight="bold">C_2 (may collude)</text>
    <text x="100" y="175" text-anchor="middle">D_2, T_2, sk_2</text>
    <text x="100" y="191" text-anchor="middle" font-style="italic" fill="#555">may collude with server</text>

    <!-- Honest client (thicker solid border AND annotation) -->
    <rect x="30" y="215" width="140" height="60" fill="#C6A87D" stroke="#1B9E77" stroke-width="3"/>
    <text x="100" y="234" text-anchor="middle" font-weight="bold">C_h (honest)</text>
    <text x="100" y="250" text-anchor="middle">D_h, T_h, sk_h</text>
    <text x="100" y="266" text-anchor="middle" font-style="italic" fill="#1B7A55">honest</text>

    <!-- Annotation pointing at the honest box -->
    <line x1="195" y1="295" x2="170" y2="252" stroke="#1B7A55" stroke-width="1" marker-end="url(#arrow-k)"/>
    <text x="200" y="307" font-style="italic" fill="#1B7A55">as long as one such client</text>
    <text x="200" y="320" font-style="italic" fill="#1B7A55">exists, privacy holds.</text>

    <!-- Colluding client N-1 (with ellipsis above) -->
    <text x="100" y="345" text-anchor="middle" font-style="italic" fill="#888">...</text>
    <rect x="30" y="355" width="140" height="60" fill="#C6A87D" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="100" y="374" text-anchor="middle" font-weight="bold">C_{N-1} (may collude)</text>
    <text x="100" y="390" text-anchor="middle">D_{N-1}, T_{N-1}, sk_{N-1}</text>
    <text x="100" y="406" text-anchor="middle" font-style="italic" fill="#555">may collude with server</text>
  </g>

  <!-- ================ Server (centre) ================ -->
  <g id="server">
    <!-- Dashed boundary around the server's compute -->
    <rect x="270" y="60" width="240" height="370" fill="none" stroke="#666" stroke-width="1.2" stroke-dasharray="6 4" rx="6"/>
    <text x="390" y="78" text-anchor="middle" font-style="italic" fill="#666">everything inside is ciphertext under pk,</text>
    <text x="390" y="92" text-anchor="middle" font-style="italic" fill="#666">IND-CPA-hidden</text>

    <!-- Server box -->
    <rect x="290" y="105" width="200" height="305" fill="#8B9EA8" stroke="#333" stroke-width="1.5" rx="3"/>
    <text x="390" y="128" text-anchor="middle" font-weight="bold" fill="#fff">Server (semi-honest)</text>
    <text x="390" y="144" text-anchor="middle" font-style="italic" fill="#fff">may collude</text>

    <!-- pk inset -->
    <rect x="305" y="165" width="170" height="32" fill="#fff" stroke="#333"/>
    <text x="390" y="186" text-anchor="middle">collective public key pk</text>

    <!-- Public probe P inset -->
    <rect x="305" y="210" width="170" height="32" fill="#fff" stroke="#333"/>
    <text x="390" y="231" text-anchor="middle">public probe P</text>

    <!-- Encrypted student inset -->
    <rect x="305" y="255" width="170" height="48" fill="#fff" stroke="#333"/>
    <text x="390" y="275" text-anchor="middle">encrypted student</text>
    <text x="390" y="293" text-anchor="middle" font-style="italic">&#x27E8;theta&#x27E9; during training</text>

    <!-- Encrypted aggregation note (helps readers parse the boundary) -->
    <text x="390" y="330" text-anchor="middle" font-style="italic" fill="#fff">homomorphic ensemble</text>
    <text x="390" y="345" text-anchor="middle" font-style="italic" fill="#fff">+ encrypted student SGD</text>

    <!-- Footnote: depth-bounded -->
    <text x="390" y="380" text-anchor="middle" font-style="italic" fill="#fff">(depth-bounded, calibrated noise)</text>
    <text x="390" y="398" text-anchor="middle" font-style="italic" fill="#fff">no plaintext ever materialised here</text>
  </g>

  <!-- ================ Arrows: client -> server (encrypted teacher logits) ================ -->
  <g id="upload-arrows">
    <!-- C_1 -->
    <line x1="170" y1="95" x2="290" y2="130" stroke="#1B9E77" stroke-width="1.4" marker-end="url(#arrow-up)"/>
    <text x="230" y="86" text-anchor="middle" fill="#1B7A55">&#x27E8;T_1(P)&#x27E9; (encrypted)</text>
    <!-- C_2 -->
    <line x1="170" y1="170" x2="290" y2="190" stroke="#1B9E77" stroke-width="1.4" marker-end="url(#arrow-up)"/>
    <text x="230" y="161" text-anchor="middle" fill="#1B7A55">&#x27E8;T_2(P)&#x27E9; (encrypted)</text>
    <!-- C_h -->
    <line x1="170" y1="245" x2="290" y2="250" stroke="#1B9E77" stroke-width="1.4" marker-end="url(#arrow-up)"/>
    <text x="230" y="236" text-anchor="middle" fill="#1B7A55">&#x27E8;T_h(P)&#x27E9; (encrypted)</text>
    <!-- C_{N-1} -->
    <line x1="170" y1="385" x2="290" y2="310" stroke="#1B9E77" stroke-width="1.4" marker-end="url(#arrow-up)"/>
    <text x="230" y="376" text-anchor="middle" fill="#1B7A55">&#x27E8;T_{N-1}(P)&#x27E9; (encrypted)</text>
  </g>

  <!-- ================ Arrows: server -> client (encrypted student release, key-switched) ================ -->
  <g id="download-arrows">
    <!-- to C_1 -->
    <line x1="290" y1="370" x2="170" y2="120" stroke="#D95F02" stroke-width="1.2" stroke-dasharray="2 2" marker-end="url(#arrow-dn)"/>
    <!-- to C_2 -->
    <line x1="290" y1="375" x2="170" y2="195" stroke="#D95F02" stroke-width="1.2" stroke-dasharray="2 2" marker-end="url(#arrow-dn)"/>
    <!-- to C_h -->
    <line x1="290" y1="380" x2="170" y2="270" stroke="#D95F02" stroke-width="1.2" stroke-dasharray="2 2" marker-end="url(#arrow-dn)"/>
    <!-- to C_{N-1} -->
    <line x1="290" y1="395" x2="170" y2="410" stroke="#D95F02" stroke-width="1.2" stroke-dasharray="2 2" marker-end="url(#arrow-dn)"/>
    <!-- Shared label, low to avoid clashing -->
    <text x="230" y="430" text-anchor="middle" fill="#A04300">&#x27E8;theta_E&#x27E9; (encrypted, then collectively key-switched)</text>
  </g>

  <!-- ================ Threshold-decryption gate inset (right, upper) ================ -->
  <g id="threshold-gate">
    <rect x="540" y="60" width="240" height="170" fill="#FFFFFF" stroke="#333" stroke-width="1" rx="3"/>
    <text x="660" y="78" text-anchor="middle" font-weight="bold">Threshold-decryption gate</text>
    <text x="660" y="94" text-anchor="middle" font-style="italic" fill="#555">N key-share inputs, one plaintext output</text>

    <!-- N key-share triangles fanning in to the gate body -->
    <!-- triangle 1 -->
    <path d="M555,115 L575,108 L575,122 z" fill="#7570B3" stroke="#333"/>
    <text x="545" y="118" text-anchor="end" font-size="10">sk_1</text>
    <line x1="575" y1="115" x2="640" y2="160" stroke="#666" stroke-width="1" marker-end="url(#arrow-k)"/>
    <!-- triangle 2 -->
    <path d="M555,145 L575,138 L575,152 z" fill="#7570B3" stroke="#333"/>
    <text x="545" y="148" text-anchor="end" font-size="10">sk_2</text>
    <line x1="575" y1="145" x2="640" y2="165" stroke="#666" stroke-width="1" marker-end="url(#arrow-k)"/>
    <!-- triangle h -->
    <path d="M555,175 L575,168 L575,182 z" fill="#7570B3" stroke="#333"/>
    <text x="545" y="178" text-anchor="end" font-size="10">sk_h</text>
    <line x1="575" y1="175" x2="640" y2="170" stroke="#666" stroke-width="1" marker-end="url(#arrow-k)"/>
    <!-- triangle N -->
    <path d="M555,205 L575,198 L575,212 z" fill="#7570B3" stroke="#333"/>
    <text x="545" y="208" text-anchor="end" font-size="10">sk_{N-1}</text>
    <line x1="575" y1="205" x2="640" y2="175" stroke="#666" stroke-width="1" marker-end="url(#arrow-k)"/>

    <!-- Gate body -->
    <rect x="640" y="150" width="80" height="40" fill="#8B9EA8" stroke="#333"/>
    <text x="680" y="174" text-anchor="middle" fill="#fff" font-style="italic">t = N</text>

    <!-- Output: one plaintext theta_E -->
    <line x1="720" y1="170" x2="765" y2="170" stroke="#333" stroke-width="1.4" marker-end="url(#arrow-k)"/>
    <text x="770" y="158" text-anchor="end" font-size="10">theta_E only</text>
    <text x="770" y="186" text-anchor="end" font-style="italic" fill="#555" font-size="10">(plaintext)</text>
  </g>

  <!-- ================ Side panel: adversary's plaintext view (Subset 2) ================ -->
  <g id="adversary-view-panel">
    <rect x="540" y="245" width="240" height="185" fill="#F4F1EA" stroke="#333" stroke-width="1" rx="3"/>
    <text x="660" y="263" text-anchor="middle" font-weight="bold">Adversary's plaintext view</text>
    <text x="660" y="278" text-anchor="middle" font-style="italic" fill="#555">(Subset 2 of PRD section 2.4)</text>

    <!-- bullets -->
    <text x="555" y="302">&#8226; encrypted teacher logits (no plaintext)</text>
    <text x="555" y="324">&#8226; encrypted ensemble target (no plaintext)</text>
    <text x="555" y="346">&#8226; encrypted student during training</text>
    <text x="565" y="360" font-style="italic" fill="#555">(no plaintext)</text>
    <text x="555" y="384">&#8226; decrypted theta_E at release time only</text>

    <!-- Closing note -->
    <text x="660" y="412" text-anchor="middle" font-style="italic" fill="#555">privacy reduces to white-box on theta_E</text>
  </g>

  <!-- ================ Bottom footer: binding invariant ================ -->
  <g id="footer">
    <text x="400" y="465" text-anchor="middle" fill="#333">Binding invariant: no per-client logit ciphertext, no aggregate, no scalar -- only theta_E -- is ever threshold-decrypted.</text>
    <text x="400" y="483" text-anchor="middle" font-style="italic" fill="#666">Threshold t = N requires all N secret-key shares; an N-1 coalition cannot decrypt any ciphertext.</text>

    <!-- Legend -->
    <g id="legend" transform="translate(60,510)">
      <rect x="0" y="0" width="14" height="14" fill="#C6A87D" stroke="#333"/>
      <text x="20" y="11">client</text>
      <rect x="80" y="0" width="14" height="14" fill="#8B9EA8" stroke="#333"/>
      <text x="100" y="11">server</text>
      <line x1="170" y1="7" x2="220" y2="7" stroke="#1B9E77" stroke-width="1.6" marker-end="url(#arrow-up)"/>
      <text x="226" y="11" fill="#1B7A55">encrypted upload</text>
      <line x1="370" y1="7" x2="420" y2="7" stroke="#D95F02" stroke-width="1.4" stroke-dasharray="2 2" marker-end="url(#arrow-dn)"/>
      <text x="426" y="11" fill="#A04300">encrypted release</text>
      <line x1="570" y1="7" x2="620" y2="7" stroke="#666" stroke-width="1" stroke-dasharray="6 4"/>
      <text x="626" y="11" fill="#666">ciphertext boundary</text>
    </g>

    <!-- variant note -->
    <text x="400" y="555" text-anchor="middle" font-style="italic" fill="#666">gamma-variant: replace plaintext probe P with encrypted client-side DP-DDPM samples; otherwise identical.</text>
  </g>

</svg>
