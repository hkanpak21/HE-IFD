# A4.1 headline accuracy grid spec
# -------------------------------------------------------------------------
# Per PRD §7.2 + action plan A4.1. Consumed by:
#   - jobs/generate_grid.py  (emits per-cell sbatch submissions)
#   - jobs/collect_grid.py   (joins manifest against results/cells/*.json)
#
# Independence guarantee (user directive 2026-05-17):
#   Each cell is its own independent sbatch job. There are NO
#   --dependency=afterok edges. Failure of any single cell (e.g. the
#   known-blocked FedDiff rows, see `methods.feddiff_eps10.known_blocked`)
#   does not block the rest of the grid.

grid:
  datasets: [MNIST, FashionMNIST, CIFAR-10]
  alphas: [0.05, 0.1, 0.3, 1.0]
  N: 10
  seeds: [42, 7, 1337]

# Tiered roll-out so the grid can be smoked → one-seeded → full without
# editing the spec. Filters are intersections with the top-level `grid`
# axis; `null` means "use the full axis from `grid`".
#
# Tier A (smoke): all datasets, alpha=0.3, seed=42.
#   = 3 datasets × 1 α × 1 seed × N_methods cells.
# Tier B (one-seed grid): all datasets, all alphas, seed=42 only.
#   = 3 × 4 × 1 × N_methods cells.
# Tier C (full grid): everything.
#   = 3 × 4 × 3 × N_methods cells.
tiers:
  A: {datasets_filter: null, alphas_filter: [0.3], seeds_filter: [42]}
  B: {datasets_filter: null, alphas_filter: null, seeds_filter: [42]}
  C: {datasets_filter: null, alphas_filter: null, seeds_filter: null}

# Methods (each maps to an sbatch wrapper + any extra positional args
# appended after `<dataset> <alpha> <seed>`). The wrapper paths mirror the
# vendor wrappers scaffolded by issues 06–09 plus the HE-IFD cell wrapper
# from issue 14.
#
# `known_blocked` is documentation only: the generator still emits the
# sbatch (so the missing-output is recorded honestly by the aggregator)
# and prints a warning. This honours the independence requirement —
# upstream placeholders do not propagate as `--dependency` chains.
methods:
  heifd_warmstart:
    wrapper: jobs/cell_heifd.sh
    extra_args: [warmstart]
  heifd_randominit:
    wrapper: jobs/cell_heifd.sh
    extra_args: [randominit]
  heifd_warmstart_no_ensemble:
    wrapper: jobs/cell_heifd.sh
    extra_args: [warmstart-no-ensemble]
  coboost:
    wrapper: jobs/cfd_v2_comp_coboost.sh
    extra_args: []
  fedmd:
    wrapper: jobs/cfd_v2_comp_fedmd.sh
    extra_args: []
  feddiff_eps10:
    wrapper: jobs/cfd_v2_comp_feddiff.sh
    extra_args: ['10']
    known_blocked: "upstream placeholder (mmendiet/FedDiff has no code as of clone date 2026-05-17)"
  fedkt_eps10:
    wrapper: jobs/cfd_v2_comp_fedkt.sh
    extra_args: ['10']

# Cells to skip (record reason so the aggregator can flag them honestly).
# Format: list of dicts each with method/dataset/alpha/seed/reason.
# The generator removes any matching cell from the submission set.
skip:
  - {method: heifd_warmstart, dataset: CIFAR-10, alpha: 0.05, seed: 1337, reason: "compute budget"}
